<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
    <title></title>
</head>
<body>
    <main>
        <div id="home">
            <h1>Welcome To My First Game</h1>
            <h2>Chose Your Diffculty</h2>
            <button id="easy" onclick="startGame(4)">Easy</button>
            <button id="medium" onclick="startGame(6)">Mediume</button>
            <button id="hard" onclick="startGame(12)">Hard</button>
        </div>
        <div id="game">
            <h1>Chose The Right Pire</h1>
            <p>Time: <span id="timer">0</span></p>
            <p>Pier<span id="matches">0</span></p>
            <div id="board"></div>
            <h2 id="message"></h2>
            <button id="restart" onclick="resetGame()">Restart</button>
            <button id="homeBtn" onclick="showHome()">Home</button>
        </div>

    </main>
</body>
</html>
